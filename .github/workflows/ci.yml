# NOTE: Ensure GitHub PAT has 'workflow' scope before pushing changes to .github/workflows
name: CI & Accuracy Baseline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Golden Dataset Extraction Baseline (Non-blocking)
        continue-on-error: true
        run: node tests/unit/golden-dataset.test.mjs
