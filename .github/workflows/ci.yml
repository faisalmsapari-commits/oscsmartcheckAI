name: CI/CD Pipeline - OSC SmartCheck AI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Typecheck, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run ESLint Inspection
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm run test

      - name: Run Golden Dataset Accuracy Baseline Report
        run: node --test tests/unit/golden-dataset.test.mjs
        continue-on-error: true

