name: CI/CD Pipeline - OSC SmartCheck AI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Typecheck, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run ESLint Inspection
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm run test

      - name: Run Golden Dataset Offline Smoke Test
        run: node --test tests/unit/golden-dataset-offline-smoketest.test.mjs

  live-accuracy-benchmark:
    name: Live Gemini 1.5 Pro Accuracy Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Live Gemini Accuracy Benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node --test tests/unit/golden-dataset-live.test.mjs
